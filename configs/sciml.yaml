# Publication SciML comparison: 3 entries x benchmarks x 3 seeds.
# Expensive (many long trainings) — launch deliberately.
device: auto
seeds: [0, 1, 2]
entries:
  - {name: pinn_primitive, kind: pinn, variables: primitive}
  - {name: pinn_conservative, kind: pinn, variables: conservative}
  - {name: fvm_pinn, kind: fvm}
  - {name: fvm_pinn_data, kind: fvm, data: true}   # sparse-data ablation
benchmarks:
  - {id: b1_circular_dry, reference_n: 1024, grid_n: 128}
  - {id: b1_circular_wet, reference_n: 1024, grid_n: 128}
  - {id: b3_three_humps, reference_n: 600, grid_n: 150}
train:
  iters: 20000
  lr: 1.0e-3
  n_collocation: 20000
  n_ic: 4000
  fvm_times: 21
  fvm_nsub: 8
  n_gauge: 64            # sparse gauge points for the data ablation
