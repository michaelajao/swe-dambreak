# Strong-form PINNs rerun WITH the bed-slope source in the residual.
# Identical to the archived publication settings except bed_source and run_root.
device: auto
run_root: revision_2026_10/strongform_bed
seeds: [0, 1, 2]
entries:
  - {name: pinn_primitive, kind: pinn, variables: primitive, bed_source: true}
  - {name: pinn_conservative, kind: pinn, variables: conservative, bed_source: true}
benchmarks:
  - {id: ca_circular_wet, reference_n: 512, grid_n: 128}
  - {id: ca_gaussian, reference_n: 512, grid_n: 128}
train:
  iters: 12000
  lr: 1.0e-3
  n_collocation: 20000
  n_ic: 4000
