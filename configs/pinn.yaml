# Publication PINN comparison: 3 entries x benchmarks x 3 seeds.
# Expensive (many long trainings) — launch deliberately.
device: auto
seeds: [0, 1, 2]
entries:
  - {name: pinn_primitive, kind: pinn, variables: primitive}
  - {name: pinn_conservative, kind: pinn, variables: conservative}
  - {name: fvm_pinn, kind: fvm}
  # sparse-data ablation, only where it matters (dry-bed momentum collapse)
  - {name: fvm_pinn_data, kind: fvm, data: true, only_benchmarks: [ca_circular_dry]}
benchmarks:
  # Coauthor-convention cases so the PINN section overlaps the classical
  # section (Circular = paper Variant 3, Step = paper Variant 1), plus a dry
  # circular to exercise the FVM-PINN low-momentum collapse + data guidance.
  - {id: ca_circular_wet, reference_n: 512, grid_n: 128}
  - {id: ca_step,         reference_n: 512, grid_n: 128}
  - {id: ca_circular_dry, reference_n: 512, grid_n: 128}
train:
  iters: 12000
  lr: 1.0e-3
  n_collocation: 20000
  n_ic: 4000
  fvm_times: 41         # collocation times; interval dt sets the CFL substep count
  fvm_nsub_max: 24      # cap on CFL substeps per interval (bounds backprop depth)
  fvm_stochastic: true  # sample one collocation interval per iter (~20x faster)
  n_gauge: 64           # sparse gauge points for the data ablation
