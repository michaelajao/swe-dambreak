[project]
name = "swe-dambreak"
version = "0.1.0"
description = "Differentiable 2D shallow-water solvers (PyTorch) + SciML comparison for dam-break problems"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe", "src/ml", "src/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# CPU wheels by default; CUDA users can override with a local index.
